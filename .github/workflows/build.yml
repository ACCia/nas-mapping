name: build

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          name="untitled-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/untitled${{ matrix.ext }}" "$name${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: untitled-${{ matrix.target }}
          path: untitled-${{ matrix.target }}${{ matrix.ext }}
